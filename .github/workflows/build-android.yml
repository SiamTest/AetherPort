name: Build Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify source rules
        run: python3 tools/verify_source.py

      - name: Run unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" "dist/ForgePort-Android-${GITHUB_SHA::7}-debug.apk"
          sha256sum "dist/ForgePort-Android-${GITHUB_SHA::7}-debug.apk" > "dist/ForgePort-Android-${GITHUB_SHA::7}-debug.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForgePort-Android-debug-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
