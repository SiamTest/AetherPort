name: Build & Release AetherPort Windows
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows unit tests, EXE, and installer
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify source and run tests
        run: |
          python -m compileall -q aetherport tests main.py
          python -m pytest -q tests
      - name: Build portable Windows app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name AetherPort --icon assets/aetherport.ico --add-data "assets;assets" --collect-submodules google_auth_oauthlib --collect-submodules google.oauth2 main.py
          if (!(Test-Path "dist/AetherPort/AetherPort.exe")) { throw "Missing AetherPort executable" }
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AetherPort/* -DestinationPath "dist/AetherPort-Windows-Portable-v3.0.19.zip" -CompressionLevel Optimal
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup not found" }
          & $iscc installer/AetherPort.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Produce hashes
        shell: pwsh
        run: |
          $assets = @("dist/AetherPort-Windows-Setup-v3.0.19.exe", "dist/AetherPort-Windows-Portable-v3.0.19.zip")
          foreach ($p in $assets) { if (!(Test-Path $p)) { throw "Missing $p" } }
          $assets | ForEach-Object { $hash = (Get-FileHash $_ -Algorithm SHA256).Hash; "$hash  $(Split-Path $_ -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AetherPort-Windows-3.0.19
          path: |
            windows/dist/AetherPort-Windows-Setup-v3.0.19.exe
            windows/dist/AetherPort-Windows-Portable-v3.0.19.zip
            windows/dist/SHA256SUMS.txt
      - name: Publish rolling Windows stable release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '${{ github.repository }}'
          gh release view windows-stable --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-stable --repo $repo --title "AetherPort Windows Stable" --notes "Windows build 3.0.19. Native Windows installer and portable ZIP." --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          }
          gh release upload windows-stable "dist/AetherPort-Windows-Setup-v3.0.19.exe" "dist/AetherPort-Windows-Portable-v3.0.19.zip" "dist/SHA256SUMS.txt" --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
